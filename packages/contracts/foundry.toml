[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# `forge script` writes the deployed address here so dev-up can publish it (§9.3).
fs_permissions = [{ access = "read-write", path = "./.contracts-state.json" }]
verbosity = 2

[rpc_endpoints]
anvil = "http://localhost:8545"
local = "${ANVIL_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 256
